[package]
name = "apple-buyer-web"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
async-stream = "0.3"
tower-http = { version = "0.7", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread", "net", "signal"] }
tempfile = "3"
fs2 = "0.4"

# Same Xcode 27 proc-macro workaround as the desktop crate.
[profile.release]
strip = "none"
[profile.release.build-override]
strip = "none"
[profile.dev.build-override]
strip = "none"
